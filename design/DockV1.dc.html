<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roadmap with the Steward</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Kalam&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#2747b8}a:hover{color:#111111}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #2747b8;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #ffffff; color: #111111; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 12px 32px; border-bottom: 1.5px solid #111111; background: #ffffff">
  <a href="MainV1.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #111111; min-height: 44px">
    <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="18" height="22" rx="2" fill="none" stroke="#111111" stroke-width="1.5"></rect><rect x="11" y="7" width="18" height="22" rx="2" fill="#ffd86b" stroke="#2747b8" stroke-width="1.5"></rect></svg>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em">GLASSINEOS HUB</span>
  </a>
  <nav aria-label="Primary" style="display: flex; flex-wrap: wrap; gap: 4px">
    <a href="MainV1.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #111111; text-decoration: none">Overview</a>
    <a href="DockV1.dc.html" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; background: #ffd86b; color: #111111; text-decoration: none; font-weight: 600">Roadmap</a>
    <a href="WorkV1.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #111111; text-decoration: none">Work</a>
    <a href="DocsV1.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #111111; text-decoration: none">Docs</a>
    <a href="InboxV1.dc.html" aria-label="Sessions, 4 waiting for you" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px; color: #111111; text-decoration: none">Sessions <span aria-hidden="true" style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border: 1.5px solid #111111; border-radius: 999px; background: #ffd86b; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; line-height: 19px; text-align: center">4</span></a>
  </nav>
</header>

<div style="flex: 1; display: flex; align-items: stretch">
  <main style="flex: 1 1 auto; min-width: 0; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 44px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em">Roadmap</h1>
      <button type="button" onClick="{{openRoad}}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1.5px solid #111111; border-radius: 12px; background: #ffffff; color: #111111; font: inherit; font-weight: 600; box-shadow: 0 3px 0 #b4b4b4; cursor: pointer">＋ Roadmap item</button>
    </div>
    <div style="overflow-x: auto">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(190px, 1fr)); gap: 12px; min-width: 800px">
        <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
          <section aria-label="{{c.name}}" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #f2f2f2; border-radius: 16px; min-height: 560px">
            <h2 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; letter-spacing: 0.08em; border-bottom: 1px dotted #111111; padding-bottom: 6px">{{c.name}}</h2>
            <sc-for list="{{c.items}}" as="i" hint-placeholder-count="2">
              <article style="{{i.style}}">
                <span style="font-weight: 600; line-height: 1.35">{{i.title}}</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #4a4a4a">hub#{{i.num}} · {{i.done}}</span>
              </article>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </div>
  </main>
  <div style="flex: none; display: flex">
    <dc-import name="SidebarV1" screen="Roadmap" selection="hub#44" open-planner="{{openPlanner}}" hint-size="440px,920px"></dc-import>
  </div>
</div>
</div>
<sc-if value="{{nwOpen}}" hint-placeholder-val="{{false}}">
  <dc-import name="NewWorkV1" open="{{yes}}" template="{{nw.template}}" repo="{{nw.repo}}" context="{{nw.context}}" by="you" notes="{{nw.notes}}" describe="{{nw.describe}}" on-close="{{closeNw}}" hint-size="0px,0px"></dc-import>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stewardPlanner":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { nw: null, evs: [] }; }
  renderVals() {
    const card = (sel) => 'display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1.5px solid #111111; border-radius: 12px; box-shadow: 0 3px 0 #b4b4b4; background: ' + (sel ? '#ffd86b' : '#ffffff');
    const I = (num, title, done, sel) => ({ num, title, done, style: card(sel) });
    return {
      yes: true, openPlanner: !!this.props.stewardPlanner,
      nwOpen: !!this.state.nw, nw: this.state.nw || {}, closeNw: () => this.setState({ nw: null }),
      openRoad: () => this.setState({ nw: { template: 'road', repo: 'hub', context: 'Roadmap', notes: '', describe: '' } }),
      cols: [
        { name: 'TODO', items: [I(60, 'Reproducible images built in CI', '1/7', false), I(63, 'docs.glassine.org v1', '3/12', false)] },
        { name: 'IN PROGRESS', items: [I(41, 'Mainline kernel boots to framebuffer', '8/10', false), I(44, 'EPD waveform driver', '3/8', true), I(52, 'Pen input latency under 20 ms', '3/9', false)] },
        { name: 'IN REVIEW', items: [I(47, 'EDL recovery path, documented', '6/7', false), I(55, 'Interleaf voices in the shell', '7/10', false)] },
        { name: 'DONE', items: [I(36, 'Hub: first private push after review', '6/6', false)] }
      ]
    };
  }
}
</script>
</body>
</html>
