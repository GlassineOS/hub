name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y -qq tmux ripgrep
      - run: pip install -e ".[dev]"
      - run: make check
  sandbox:
    # The boundary itself, run for real. Ubuntu's bubblewrap is older than the overlays need, and it blocks unprivileged
    # user namespaces by default.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y -qq tmux passt meson ninja-build libcap-dev pkg-config ripgrep
      - run: |
          git clone --quiet https://github.com/containers/bubblewrap /tmp/bwrap
          git -C /tmp/bwrap checkout --quiet ca572eed9719548effe0f6302039649cb4dff48e  # v0.11.2
          meson setup /tmp/bwrap/build /tmp/bwrap --prefix=/usr/local -Dman=disabled -Dtests=false
          ninja -C /tmp/bwrap/build
          sudo ninja -C /tmp/bwrap/build install
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -e ".[dev]"
      - run: HUB_REQUIRE_SANDBOX=1 python -m pytest -q tests/test_shell_hook.py tests/test_codemap.py::test_the_real_sandbox_holds tests/test_codesearch.py::test_the_real_sandbox_holds tests/test_codesearch.py::test_the_real_ripgrep_runs_in_the_real_sandbox
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t glassine-hub .
  boards:
    # The design boards against their references, in the Alpine and Chromium the references were made with, without
    # network. A pull request runs them when it can change a pixel; main and manual runs always do.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: scope
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --name-only HEAD^1 HEAD | grep -qE '^(design/|Makefile$|\.github/workflows/test\.yml$)'; then run=yes; else run=no; fi
          elif [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            run=yes
          else
            run=no
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "boards: $run"
      - name: Alpine with the pinned Chromium
        if: steps.scope.outputs.run == 'yes'
        run: |
          UI=$(make -s boards-ui)
          echo "UI=$UI" >> "$GITHUB_ENV"
          docker build -t boards --build-arg CHROMIUM="$(cat "$UI/tools/chromium.pin")" - <<'EOF'
          FROM alpine:3.24
          ARG CHROMIUM
          RUN apk add --no-cache "chromium=$CHROMIUM" nodejs npm font-dejavu make
          EOF
          docker run --rm -v "$UI:$UI" -w "$UI" boards npm ci --ignore-scripts --no-audit --no-fund
      - name: boards-check and boards-references, no network
        if: steps.scope.outputs.run == 'yes'
        run: |
          docker run --rm --network none -v "$UI:$UI" -v "$PWD:$PWD" -w "$PWD" -e CHROMIUM=/usr/bin/chromium-browser boards \
            make -k boards-check boards-references IN_ALPINE= UI="$UI"
      - name: the differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: references
          path: out/references/
          if-no-files-found: ignore
