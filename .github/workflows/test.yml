name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y -qq tmux ripgrep
      - run: pip install -e ".[dev]"
      - run: make check
  sandbox:
    # The boundary itself, run for real. Ubuntu's bubblewrap is older than the overlays need, and it blocks unprivileged
    # user namespaces by default.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y -qq tmux passt meson ninja-build libcap-dev pkg-config ripgrep
      - run: |
          git clone --quiet https://github.com/containers/bubblewrap /tmp/bwrap
          git -C /tmp/bwrap checkout --quiet ca572eed9719548effe0f6302039649cb4dff48e  # v0.11.2
          meson setup /tmp/bwrap/build /tmp/bwrap --prefix=/usr/local -Dman=disabled -Dtests=false
          ninja -C /tmp/bwrap/build
          sudo ninja -C /tmp/bwrap/build install
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -e ".[dev]"
      - run: HUB_REQUIRE_SANDBOX=1 python -m pytest -q tests/test_shell_hook.py tests/test_codemap.py::test_the_real_sandbox_holds tests/test_codesearch.py::test_the_real_sandbox_holds tests/test_codesearch.py::test_the_real_ripgrep_runs_in_the_real_sandbox
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t glassine-hub .
