[project]
name = "glassine-hub"
version = "0.1.0"
description = "The GlassineOS project dashboard, tool server and host shells"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
# hubd itself uses only the standard library. These are the app's, in its container.
dependencies = ["mcp==2.3.0", "jsonschema>=4.20", "starlette==1.10.0", "uvicorn==0.54.0", "websockets==17.4", "numpy>=1.24"]

[project.optional-dependencies]
# The code map's parser, for its tests. The same pins as deploy/codemap-requirements.txt, which is what a host gets.
dev = ["pytest", "httpx", "tree-sitter==0.26.0", "tree-sitter-c==0.24.2", "tree-sitter-python==0.25.0", "tree-sitter-javascript==0.25.0", "tree-sitter-bash==0.25.1", "tree-sitter-rust==0.24.2"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_probe: runs the real sandbox probe"]
