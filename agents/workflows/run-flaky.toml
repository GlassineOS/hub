schema = 1
name = "run-flaky"
initial = "session"

[launch]
personas = ["ci-diagnostician"]
result = "none"

[[start]]
on = "run"
label = "Check for flakiness"
summary = "Compares the failure with recent runs of the workflow. Reports in the session."
ceiling = "Read only."
order = 2
when = "failing"
when_held = "beside"
models = ["sonnet", "opus"]
efforts = ["low", "medium", "high"]
prompt = '''
Compare failed Actions run {number} of GlassineOS/{repo} with recent runs of the same workflow.
Is the failure flaky? Report here, in this session, with the runs you compared. You change nothing.
'''


[state.session]
final = true
[state.session.grant]
tools = ["AskUserQuestion"]
hub_tools = ["plan_work", "get_run", "get_run_log", "list_runs", "docs_search", "work_search"]
checkout = false
