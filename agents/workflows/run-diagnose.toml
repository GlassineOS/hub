# SPDX-License-Identifier: GPL-2.0-or-later
schema = 1
name = "run-diagnose"
initial = "session"

[launch]
personas = ["ci-diagnostician"]
result = "findings"

[[start]]
on = "run"
label = "Investigate failure"
summary = "Finds out why the run failed and hands in the cause and the smallest fix. Changes nothing."
ceiling = "Reads the run and its logs. Changes nothing."
order = 1
verb = "investigate"
when = "failing"
models = ["sonnet", "opus"]
efforts = ["low", "medium", "high"]
prompt = '''
Find out why Actions run {number} of GlassineOS/{repo} failed.

Read the run and its failed log, and search the docs where they help. Report here, in this
session: the first real error, the cause, how sure you are, and the fix you'd make. You
change nothing.

Then hand in what you found with `submit_result`, type `findings`, as the last thing you do:
`cause` (the first real error and why it happened, with how sure you are), `fix` (the smallest
change that would make it pass), `files` (the paths it touches, at most 20) and `run`
(`{repo}#{number}`). The person can start a fix session from it.
'''


[state.session]
final = true
[state.session.grant]
tools = ["Skill", "AskUserQuestion"]
hub_tools = ["plan_work", "get_run", "get_run_log", "submit_result", "docs_search", "work_search"]
checkout = false
