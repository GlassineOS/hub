query($org: String!, $repo: String!, $number: Int!) {
  repository(owner: $org, name: $repo) {
    pullRequest(number: $number) {
      reviewThreads(first: 100) {
        nodes {
          id
          isResolved
          isOutdated
          path
          line
          comments(first: 50) {
            nodes { author { login } body createdAt url diffHunk }
          }
        }
      }
    }
  }
}
